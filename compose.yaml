services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: trainy_test
      POSTGRES_USER: trainy
      POSTGRES_PASSWORD: trainy_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainy -d trainy_test"]
      interval: 2s
      timeout: 3s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data
