# nginx's add_header only inherits into a location block that defines none of
# its own, so the security headers are repeated in every location below
# instead of set once at the server level.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Closes the client-side CSP/Permissions-Policy gap noted in
    # summarize/localhost-pentest-owasp.md — the server already sets these,
    # this is the "hosting decision" that lets the client set them too.
    # connect-src is just 'self': the API is reverse-proxied under /api on
    # this same origin (see the /api/ location below), never a separate host.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Reverse-proxy the API onto this same origin so client and server share
    # one domain (no cross-site cookies, no CORS needed for the browser).
    # No path component after the upstream in proxy_pass, so nginx forwards
    # the request URI (including the /api/ prefix) unchanged — matching what
    # the server itself mounts its routes under (server/src/app.ts).
    location /api/ {
        # The server sets its own correct security headers for a JSON API
        # (e.g. CSP "default-src 'none'"). Having this location define at
        # least one add_header of its own stops it from also inheriting the
        # static-page headers above, which would otherwise duplicate on top.
        add_header X-Proxied-By "trainy-client" always;

        proxy_pass http://server:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # Client-side routing (TanStack Router): fall back to index.html for
        # any path that isn't a real static file.
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store";
    }

    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|webp|woff2?)$ {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
