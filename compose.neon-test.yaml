# Use with:
# docker compose --env-file server/.env.neon-test \
#   -f compose.yaml -f compose.neon-test.yaml up --build server client
services:
  server:
    depends_on: !reset []
    environment:
      DATABASE_URL: ${DATABASE_URL:?set the pooled Neon test branch DATABASE_URL}
      DATABASE_DRIVER: neon
      DATABASE_ENVIRONMENT: ${DATABASE_ENVIRONMENT:?set DATABASE_ENVIRONMENT=test}
      NEON_TEST_HOST: ${NEON_TEST_HOST:?set the exact Neon test branch hostname}
      NEON_ALLOW_PRODUCTION_RESET: ${NEON_ALLOW_PRODUCTION_RESET:-false}
    command:
      - sh
      - -c
      - bun run db:neon:check && bun run db:migrate && bun run db:seed && bun run db:neon:check && bun run dist/index.js
